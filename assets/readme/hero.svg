  <circle cx="1430" cy="80" r="250" fill="#EFEBFF" opacity="0.62"/>
  <circle cx="112" cy="700" r="220" fill="#F7F5FF"/>

  <g filter="url(#soft-shadow)">
    <rect x="42" y="34" width="1516" height="692" rx="34" fill="#FFFFFF" stroke="#E6E5EA" stroke-width="2"/>
  </g>

  <path d="M42 108H1558" stroke="#EEEDF1" stroke-width="2"/>
  <circle cx="78" cy="71" r="7" fill="#DEDDE4"/>
  <circle cx="102" cy="71" r="7" fill="#DEDDE4"/>
  <circle cx="126" cy="71" r="7" fill="#DEDDE4"/>

