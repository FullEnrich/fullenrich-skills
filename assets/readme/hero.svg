<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">FullEnrich MCP connects verified B2B data to AI agents</title>
  <desc id="hero-desc">A polished agent workspace shows a prospect search moving to a free preview, a credit check, and explicit confirmation before enrichment.</desc>
  <defs>
    <linearGradient id="canvas-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5FF"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFAFB"/>
    </linearGradient>
    <linearGradient id="brand-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8164F4"/>
      <stop offset="1" stop-color="#4B25BB"/>
