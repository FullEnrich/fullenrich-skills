      <text x="76" y="36" fill="#2D2B36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750">FullEnrich</text>
      <text x="76" y="55" fill="#797783" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600">search_people · preview</text>
