<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">FullEnrich MCP workflow from request to verified data</title>
  <desc id="workflow-desc">Five connected steps show an AI agent asking, searching, previewing results, requesting approval before spending credits, and returning verified data.</desc>
  <defs>
    <linearGradient id="workflow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="workflow-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8164F4"/>
      <stop offset="1" stop-color="#4B25BB"/>
    </linearGradient>
    <filter id="workflow-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#291466" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C5B5FC"/>
    </marker>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#workflow-bg)"/>
  <rect x="42" y="38" width="1516" height="444" rx="28" fill="#FFFFFF" stroke="#E6E5EA" stroke-width="2"/>

  <g transform="translate(90 78)">
    <rect width="34" height="34" rx="10" fill="url(#workflow-brand)"/>
    <path d="M17.3 7.5c-.3-1.2-2-1.2-2.3 0l-.6 2.8a4 4 0 0 1-3.2 3.2l-2.8.6c-1.2.3-1.2 2 0 2.3l2.8.6a4 4 0 0 1 3.2 3.2l.6 2.8c.3 1.2 2 1.2 2.3 0l.6-2.8a4 4 0 0 1 3.2-3.2l2.8-.6c1.2-.3 1.2-2 0-2.3l-2.8-.6a4 4 0 0 1-3.2-3.2l-.6-2.8Z" fill="#FFFFFF"/>
    <text x="50" y="22" fill="#2D2B36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="760" letter-spacing="-0.4">One conversation. A controlled path to verified data.</text>
    <text x="1378" y="22" text-anchor="end" fill="#9997A3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="650" letter-spacing="0.7">FULLENRICH MCP · 5 STEPS</text>
  </g>

  <g transform="translate(86 164)">
    <path d="M242 112H306" stroke="#C5B5FC" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M528 112H592" stroke="#C5B5FC" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M814 112H878" stroke="#C5B5FC" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1100 112H1164" stroke="#C5B5FC" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#workflow-shadow)">
      <rect width="242" height="224" rx="22" fill="#FFFFFF" stroke="#E6E5EA" stroke-width="2"/>
      <circle cx="38" cy="38" r="18" fill="#2D2B36"/>
      <text x="38" y="44" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="750">01</text>
      <text x="24" y="88" fill="#2D2B36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="760">Ask</text>
      <text x="24" y="120" fill="#797783" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500">
        <tspan x="24">Describe the people or</tspan>
        <tspan x="24" dy="21">companies you need.</tspan>
      </text>
      <rect x="24" y="172" width="194" height="28" rx="14" fill="#F6F5F9"/>
      <text x="121" y="191" text-anchor="middle" fill="#605E68" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="650">natural language</text>
    </g>

    <g transform="translate(286)" filter="url(#workflow-shadow)">
      <rect width="242" height="224" rx="22" fill="#FFFFFF" stroke="#DDD1FF" stroke-width="2"/>
      <circle cx="38" cy="38" r="18" fill="#EFEBFF"/>
      <text x="38" y="44" text-anchor="middle" fill="#4B25BB" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="750">02</text>
      <text x="24" y="88" fill="#2D2B36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="760">Search</text>
      <text x="24" y="120" fill="#797783" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500">
        <tspan x="24">FullEnrich applies the</tspan>
        <tspan x="24" dy="21">right structured filters.</tspan>
      </text>
      <rect x="24" y="164" width="194" height="36" rx="12" fill="#EFEBFF"/>
      <text x="121" y="187" text-anchor="middle" fill="#4B25BB" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700">search_people · companies</text>
    </g>

    <g transform="translate(572)" filter="url(#workflow-shadow)">
      <rect width="242" height="224" rx="22" fill="#FFFFFF" stroke="#DDD1FF" stroke-width="2"/>
      <circle cx="38" cy="38" r="18" fill="#EFEBFF"/>
      <text x="38" y="44" text-anchor="middle" fill="#4B25BB" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="750">03</text>
      <text x="24" y="88" fill="#2D2B36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="760">Preview</text>
      <text x="24" y="120" fill="#797783" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500">
        <tspan x="24">Review matches before</tspan>
        <tspan x="24" dy="21">spending any credits.</tspan>
      </text>
      <rect x="24" y="172" width="116" height="28" rx="14" fill="#ECF8F1"/>
      <circle cx="42" cy="186" r="5" fill="#37A36B"/>
      <text x="88" y="191" text-anchor="middle" fill="#287A50" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">FREE</text>
      <text x="218" y="190" text-anchor="end" fill="#9997A3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" font-weight="650">results</text>
    </g>

    <g transform="translate(858)" filter="url(#workflow-shadow)">
      <rect width="242" height="224" rx="22" fill="#FFFCF7" stroke="#F9C678" stroke-width="2"/>
      <circle cx="38" cy="38" r="18" fill="#FEF1D6"/>
      <text x="38" y="44" text-anchor="middle" fill="#BD5311" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="750">04</text>
      <text x="24" y="88" fill="#2D2B36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="760">Approve</text>
      <text x="24" y="120" fill="#797783" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500">
        <tspan x="24">See your balance and</tspan>
        <tspan x="24" dy="21">confirm the paid action.</tspan>
      </text>
      <rect x="24" y="164" width="194" height="36" rx="12" fill="#FEF1D6"/>
      <text x="121" y="187" text-anchor="middle" fill="#BD5311" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700">get_credits · confirmation</text>
    </g>

    <g transform="translate(1144)" filter="url(#workflow-shadow)">
      <rect width="242" height="224" rx="22" fill="url(#workflow-brand)"/>
      <circle cx="38" cy="38" r="18" fill="#FFFFFF" opacity="0.18"/>
      <text x="38" y="44" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="750">05</text>
      <text x="24" y="88" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="760">Verified data</text>
      <text x="24" y="120" fill="#EFEBFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500">
        <tspan x="24">Enrich work emails and</tspan>
        <tspan x="24" dy="21">phones, then export.</tspan>
      </text>
      <rect x="24" y="164" width="194" height="36" rx="12" fill="#FFFFFF" opacity="0.14"/>
      <text x="121" y="187" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" font-weight="700">enrich · export CSV / JSON</text>
    </g>
  </g>

  <text x="800" y="444" text-anchor="middle" fill="#9997A3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">The agent can explore first. FullEnrich waits for explicit confirmation before enrichment or larger exports.</text>
</svg>
